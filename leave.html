<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>LEAVE A MESSAGE — PRECIOUS MESS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');

        body {
            background-color: #050505;
            color: #c9c9c9;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
            background-image: radial-gradient(#0a1a0a 0.6px, #050505 0.6px);
            background-size: 14px 14px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                transparent 0px,
                rgba(0, 40, 0, 0.12) 1px,
                transparent 2px
            );
            z-index: 10;
        }

        .page-container {
            position: relative;
            z-index: 2;
            width: 94%;
            max-width: 960px;
            padding: 60px 20px 40px;
            margin: 30px auto;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .main-title {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 4.5rem;
            letter-spacing: 8px;
            color: #e0ffe0;
            text-align: center;
            text-shadow: 
                0 0 4px #00ff41, 
                0 0 12px #00aa2a, 
                0 0 24px #006600,
                0 0 48px #003300;
            animation: flicker 7s infinite alternate;
            line-height: 1;
        }

        @keyframes flicker {
            0% { opacity: 0.85; text-shadow: 0 0 4px #00ff41, 0 0 12px #00aa2a, 0 0 24px #006600; }
            50% { opacity: 1; text-shadow: 0 0 8px #00ff41, 0 0 20px #00cc44, 0 0 40px #008800; }
            100% { opacity: 0.8; text-shadow: 0 0 4px #00ff41, 0 0 12px #00aa2a, 0 0 24px #006600; }
        }

        .diamond-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px #00ff41) drop-shadow(0 0 20px #006600);
            transition: transform 0.3s ease, filter 0.3s ease;
            padding: 6px;
            border-radius: 8px;
            user-select: none;
        }
        .diamond-icon:hover {
            transform: scale(1.1) rotate(15deg);
            filter: drop-shadow(0 0 20px #00ff41) drop-shadow(0 0 40px #00aa2a);
        }
        .diamond-icon:active {
            transform: scale(0.9);
        }
        .diamond-icon svg {
            display: block;
            width: 44px;
            height: 44px;
        }

        .divider {
            width: 80%;
            height: 1px;
            margin: 0 auto 30px;
            border: none;
            background: linear-gradient(90deg, transparent, #aaa, transparent);
            box-shadow: 0 0 6px #666;
            opacity: 0.6;
        }

        .sub-title {
            text-align: center;
            font-size: 16px;
            letter-spacing: 4px;
            color: #7a7a7a;
            margin-bottom: 60px;
            text-shadow: 0 0 6px rgba(200, 200, 200, 0.1);
        }

        .message-block {
            display: flex;
            align-items: flex-start;
            gap: 50px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .avatar-container {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .avatar-ring-1,
        .avatar-ring-2 {
            position: absolute;
            width: 108px;
            height: 108px;
            border-radius: 50%;
            border: 1px solid transparent;
            box-sizing: border-box;
            pointer-events: none;
        }
        .avatar-ring-1 {
            border-top-color: rgba(220, 220, 220, 0.9);
            border-right-color: rgba(220, 220, 220, 0.5);
            animation: spinClock 2.5s linear infinite;
        }
        .avatar-ring-2 {
            border-bottom-color: rgba(220, 220, 220, 0.9);
            border-left-color: rgba(220, 220, 220, 0.5);
            animation: spinCounter 3s linear infinite;
        }
        @keyframes spinClock {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spinCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .avatar-inner {
            position: relative;
            z-index: 1;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            background: #000;
            border: 1px solid #444;
            box-shadow: 0 0 10px rgba(150, 150, 150, 0.15);
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bubble {
            flex: 1;
            min-width: 320px;
            background: rgba(10, 20, 10, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 12px;
            padding: 28px 36px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.06), inset 0 0 15px rgba(0, 255, 65, 0.03);
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            line-height: 2;
            color: #b8d8b8;
            letter-spacing: 0.5px;
        }

        .bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 32px;
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-right: 12px solid rgba(10, 20, 10, 0.7);
        }

        .bubble .signature {
            margin-top: 24px;
            color: #00ff41;
            text-shadow: 0 0 10px #00aa2a;
            font-style: italic;
            text-align: right;
            font-size: 18px;
        }

        .guestbook-container {
            display: flex;
            gap: 25px;
            background: rgba(5, 15, 5, 0.5);
            border: 1px solid rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.05);
            padding: 16px;
            border-radius: 2px;
            backdrop-filter: blur(6px);
            min-height: 460px;
            margin-top: 40px;
            flex-wrap: wrap;
            position: relative;
        }

        .left-panel {
            flex: 0 0 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right-panel {
            flex: 1;
            min-width: 260px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding-left: 28px;
            overflow-y: auto;
            max-height: 460px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .right-panel-title {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 26px;
            letter-spacing: 4px;
            color: #b0c0b0;
            text-shadow: 0 0 8px #555;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(200, 200, 200, 0.25);
        }

        .right-panel::-webkit-scrollbar {
            width: 4px;
        }
        .right-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .right-panel::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }
        .right-panel {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 20, 0, 0.7);
            border: 1px solid rgba(0, 255, 65, 0.3);
            backdrop-filter: blur(4px);
            padding: 14px 22px;
            color: #d0ffd0;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            letter-spacing: 0.5px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            border-radius: 2px;
            line-height: 1.7;
            box-sizing: border-box;
        }

        .input-field::placeholder {
            color: #3a6a3a;
            font-style: italic;
        }

        .input-field:focus {
            border-color: #aaa;
            box-shadow: 0 0 12px rgba(200, 200, 200, 0.2);
        }

        .message-textarea {
            min-height: 140px;
            resize: vertical;
        }

        .send-btn {
            background: rgba(0, 30, 0, 0.7);
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            letter-spacing: 2px;
            padding: 16px 32px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
            text-shadow: 0 0 6px #006600;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            align-self: flex-start;
        }

        .send-btn:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 25px rgba(200, 200, 200, 0.25);
            border-color: #aaa;
            color: #fff;
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        .email-box {
            background: rgba(0, 15, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 255, 65, 0.15);
            padding: 20px 24px;
            text-align: left;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.03);
            border-radius: 2px;
            margin-top: 10px;
        }

        .email-box .email-label {
            font-size: 14px;
            letter-spacing: 2px;
            color: #ff4d4d;
            text-shadow: 0 0 8px #ff4d4d;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .email-box .email-address {
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            color: #d0ffd0;
            text-shadow: 0 0 8px rgba(200, 200, 200, 0.3);
            word-break: break-all;
            margin-bottom: 4px;
        }

        .create-email-link {
            display: inline-block;
            margin-top: 8px;
            color: #00ff41;
            text-decoration: none;
            font-size: 15px;
            border: 1px solid #00ff41;
            padding: 10px 20px;
            border-radius: 2px;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            background: rgba(0, 255, 65, 0.05);
            text-shadow: 0 0 6px #006600;
            align-self: flex-start;
        }

        .create-email-link:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(200, 200, 200, 0.3);
            border-color: #aaa;
            color: #fff;
        }

        .forum-post {
            display: flex;
            gap: 14px;
            padding: 14px 16px;
            background: rgba(0, 25, 0, 0.5);
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 65, 0.1);
            transition: background 0.2s;
        }
        .forum-post:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .forum-avatar {
            width: 44px;
            height: 44px;
            border-radius: 4px;
            background: #444;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 1px #555;
        }
        .forum-avatar::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: #aaa;
            border-radius: 50%;
        }
        .forum-avatar::after {
            content: '';
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 18px;
            background: #aaa;
            border-radius: 50% 50% 0 0;
        }

        .forum-content {
            flex: 1;
        }
        .forum-username {
            font-size: 14px;
            color: #ff6666;
            text-shadow: 0 0 6px #990000;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .forum-text {
            font-size: 15px;
            color: #9aaa9a;
            line-height: 1.6;
            word-break: break-all;
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            color: #4a6a4a;
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 20;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .back-link:hover {
            color: #aaa;
            text-shadow: 0 0 8px #888;
        }

        /* ===== 音乐播放器按钮样式 (和主页一致) ===== */
        .music-btn {
            position: fixed;
            top: 78px;
            left: 24px;
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            user-select: none;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 1);
        }
        .music-btn:active {
            transform: scale(0.92);
        }
        .music-btn.playing {
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.25), 0 0 40px rgba(0, 255, 65, 0.08);
            border-color: rgba(0, 255, 65, 0.25);
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <a href="index.html" class="back-link">← BACK</a>

    <!-- ===== 留言板独立音乐播放器 ===== -->
    <button class="music-btn" id="musicBtn" aria-label="播放/暂停音乐">▶</button>
    <audio id="bgMusic" loop preload="auto">
        <source src="WTF.mp3" type="audio/mpeg">
    </audio>

    <div class="page-container">
        <div class="title-row">
            <span class="diamond-icon" id="refreshDiamond" title="点击刷新页面">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,5 95,50 50,95 5,50" fill="none" stroke="#00ff41" stroke-width="3" filter="url(#glow)"/>
                    <polygon points="50,15 85,50 50,85 15,50" fill="none" stroke="#00ff41" stroke-width="1.5"/>
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                </svg>
            </span>
            <h1 class="main-title">Leave a Message</h1>
        </div>
        <hr class="divider" />
        <p class="sub-title">试着留下你存在过的痕迹</p>

        <div class="message-block">
            <div class="avatar-container">
                <div class="avatar-ring-1"></div>
                <div class="avatar-ring-2"></div>
                <div class="avatar-inner">
                    <img src="touxiang1.jpg" alt="Virel09" />
                </div>
            </div>
            <div class="bubble">
                在这里，留下你的发言。它们可以是任何东西，输入你的内容，它们会被发送至我的邮箱，我会记录它们，并放到下面进行展示。你可以向我发送任何，或者其他的视频。只要你想，就可以将它们展示到这里。向我投稿吧！<br />
                <span class="signature">—— Virel09</span>
            </div>
        </div>

        <div class="guestbook-container">
            <div class="left-panel">
                <input type="text" class="input-field" id="nameInput" placeholder="输入你的名字 (可选)" />
                <textarea class="input-field message-textarea" id="messageInput" placeholder="点击输入你想说的内容..."></textarea>
                <button class="send-btn" id="sendBtn">发 送</button>
                <div class="email-box">
                    <div class="email-label">投稿至我的邮箱 · 境内</div>
                    <div class="email-address">viyoster@88.com</div>
                    <div class="email-label" style="margin-top:14px;">投稿至我的邮箱 · 境外</div>
                    <div class="email-address">29viyoster@gmail.com</div>
                </div>
                <a class="create-email-link" href="https://www.88.com/#/" target="_blank">创建邮箱</a>
            </div>
            <div class="right-panel">
                <div class="right-panel-title">留言板</div>
                <div id="messageListContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== 留言板音乐播放逻辑 =====
        (function() {
            const audio = document.getElementById('bgMusic');
            const btn = document.getElementById('musicBtn');
            let isPlaying = false;
            function tryAutoPlay() {
                audio.play().then(() => {
                    isPlaying = true;
                    btn.textContent = '⏸';
                    btn.classList.add('playing');
                }).catch(() => {
                    isPlaying = false;
                    btn.textContent = '▶';
                    btn.classList.remove('playing');
                });
            }
            window.addEventListener('load', function() {
                setTimeout(tryAutoPlay, 500);
            });
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPlaying) {
                    audio.pause();
                    btn.textContent = '▶';
                    btn.classList.remove('playing');
                    isPlaying = false;
                } else {
                    audio.play().then(() => {
                        btn.textContent = '⏸';
                        btn.classList.add('playing');
                        isPlaying = true;
                    }).catch(() => {
                        btn.textContent = '▶';
                        btn.classList.remove('playing');
                        isPlaying = false;
                    });
                }
            });
            audio.addEventListener('ended', function() {
                if (!audio.loop) {
                    btn.textContent = '▶';
                    btn.classList.remove('playing');
                    isPlaying = false;
                }
            });
        })();

        // ===== 粒子特效 =====
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 2 + 1;
            const colors = ['#00ff41', '#00aa2a', '#006600', '#33ff77', '#aaa', '#ddd', '#fff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = color;
            particle.style.boxShadow = `0 0 6px ${color}`;
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = '-5%';
            document.body.appendChild(particle);

            let posY = -5;
            let posX = parseFloat(particle.style.left);
            const fallSpeed = Math.random() * 0.6 + 0.3;
            const drift = (Math.random() - 0.5) * 0.4;
            function animate() {
                posY += fallSpeed;
                posX += drift;
                particle.style.top = posY + '%';
                particle.style.left = posX + '%';
                if (posY < 105) {
                    requestAnimationFrame(animate);
                } else {
                    particle.remove();
                }
            }
            animate();
        }
        setInterval(createParticle, 100);

        // ===== 菱形刷新 =====
        document.getElementById('refreshDiamond').addEventListener('click', function() {
            this.style.transition = 'transform 0.4s ease';
            this.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                location.reload();
            }, 400);
        });

        // ===== 核心：已填入你刚才创建的 Cloudflare Worker 网址 ======
        const WORKER_API_URL = 'https://mine.74hztrjms2.workers.dev'; 
        // =================================================================

        const nameInput = document.getElementById('nameInput');
        const textarea = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messageListContainer = document.getElementById('messageListContainer');

        async function loadMessages() {
            try {
                const response = await fetch(`${WORKER_API_URL}/api/messages`);
                if (!response.ok) throw new Error('加载失败');
                const messages = await response.json();
                messageListContainer.innerHTML = '';

                if (messages.length === 0) {
                    messageListContainer.innerHTML = `
                        <div class="forum-post">
                            <div class="forum-avatar"></div>
                            <div class="forum-content">
                                <div class="forum-username">系统提示</div>
                                <div class="forum-text">还没有人留言，快来成为第一个留下痕迹的人吧！</div>
                            </div>
                        </div>
                    `;
                } else {
                    messages.forEach(msg => {
                        const username = msg.name && msg.name.trim() !== '' ? msg.name : '匿名用户';
                        const postDiv = document.createElement('div');
                        postDiv.className = 'forum-post';
                        postDiv.innerHTML = `
                            <div class="forum-avatar"></div>
                            <div class="forum-content">
                                <div class="forum-username">${escapeHtml(username)}</div>
                                <div class="forum-text">${escapeHtml(msg.content)}</div>
                            </div>
                        `;
                        messageListContainer.appendChild(postDiv);
                    });
                }
            } catch (error) {
                console.error(error);
                messageListContainer.innerHTML = `
                    <div class="forum-post">
                        <div class="forum-avatar"></div>
                        <div class="forum-content">
                            <div class="forum-username" style="color:#ff4d4d;">⚠️ 加载失败</div>
                            <div class="forum-text">请检查网络连接，稍后刷新重试。</div>
                        </div>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        async function sendMessage() {
            const name = nameInput.value.trim();
            const message = textarea.value.trim();
            if (!message) {
                alert("请至少输入你想说的话！");
                return;
            }
            sendBtn.textContent = '发送中...';
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${WORKER_API_URL}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: name || '匿名用户',
                        content: message 
                    })
                });

                if (response.ok) {
                    nameInput.value = '';
                    textarea.value = '';
                    await loadMessages();
                } else {
                    alert('发送失败，请稍后再试，或直接发送至我的邮箱。');
                }
            } catch (error) {
                alert('网络错误，请直接发送至我的邮箱。');
            }

            sendBtn.textContent = '发 送';
            sendBtn.disabled = false;
        }

        sendBtn.addEventListener('click', sendMessage);
        textarea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        loadMessages();
    </script>
</body>
</html>
