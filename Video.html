<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>VIDEO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');

        body {
            background-color: #0a0a0a;
            color: #c9c9c9;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .page-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .category-item {
            width: 100%;
            margin-bottom: 80px; /* 增大 ABCD 之间的间隔 */
            text-align: center;
        }

        .category-header {
            cursor: pointer;
            padding: 10px;
            user-select: none;
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 24px;
            letter-spacing: 2px;
            color: #888;
            transition: color 0.2s ease;
        }

        .category-header:hover {
            color: #b00;
        }

        .category-arrow {
            display: inline-block;
            margin-left: 8px;
            font-size: 16px;
            color: #555;
            transition: transform 0.3s ease;
            vertical-align: middle;
        }

        .category-item.open .category-arrow {
            transform: rotate(90deg);
            color: #b00;
        }

        .category-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            width: 100%;
        }

        .category-item.open .category-content {
            max-height: 2000px; /* 展开空间变大以适应大视频 */
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr; /* 单列竖排 */
            gap: 20px;
            padding: 20px 0;
        }

        .video-placeholder {
            height: 400px; /* 占位视频变大 */
            background: #0e0e0e;
            border: 1px dashed #2a2a2a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-family: 'Space Mono', monospace;
            font-size: 18px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .video-placeholder:hover {
            border-color: #b00;
            color: #888;
            background: #111;
        }

        @media screen and (max-width: 600px) {
            .page-container {
                padding: 60px 15px;
            }
            .video-placeholder {
                height: 250px; /* 手机端稍微小一点 */
            }
            .category-item {
                margin-bottom: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="category-item" id="catA">
            <div class="category-header" onclick="toggleCategory('A')">
                <span>A</span><span class="category-arrow">▶</span>
            </div>
            <div class="category-content">
                <div class="video-grid">
                    <div class="video-placeholder">VIDEO 01</div>
                    <div class="video-placeholder">VIDEO 02</div>
                    <div class="video-placeholder">VIDEO 03</div>
                    <div class="video-placeholder">VIDEO 04</div>
                </div>
            </div>
        </div>

        <div class="category-item" id="catB">
            <div class="category-header" onclick="toggleCategory('B')">
                <span>B</span><span class="category-arrow">▶</span>
            </div>
            <div class="category-content">
                <div class="video-grid">
                    <div class="video-placeholder">VIDEO 01</div>
                    <div class="video-placeholder">VIDEO 02</div>
                    <div class="video-placeholder">VIDEO 03</div>
                    <div class="video-placeholder">VIDEO 04</div>
                </div>
            </div>
        </div>

        <div class="category-item" id="catC">
            <div class="category-header" onclick="toggleCategory('C')">
                <span>C</span><span class="category-arrow">▶</span>
            </div>
            <div class="category-content">
                <div class="video-grid">
                    <div class="video-placeholder">VIDEO 01</div>
                    <div class="video-placeholder">VIDEO 02</div>
                    <div class="video-placeholder">VIDEO 03</div>
                    <div class="video-placeholder">VIDEO 04</div>
                </div>
            </div>
        </div>

        <div class="category-item" id="catD">
            <div class="category-header" onclick="toggleCategory('D')">
                <span>D</span><span class="category-arrow">▶</span>
            </div>
            <div class="category-content">
                <div class="video-grid">
                    <div class="video-placeholder">VIDEO 01</div>
                    <div class="video-placeholder">VIDEO 02</div>
                    <div class="video-placeholder">VIDEO 03</div>
                    <div class="video-placeholder">VIDEO 04</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleCategory(key) {
            const item = document.getElementById('cat' + key);
            item.classList.toggle('open');
        }

        document.addEventListener('keydown', function(e) {
            const key = e.key.toUpperCase();
            if (['A', 'B', 'C', 'D'].includes(key)) {
                toggleCategory(key);
            }
        });
    </script>
</body>
</html>
